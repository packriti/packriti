<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packriti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ivory:#F5EFE3;
    --ivory-soft:#EEE4CE;
    --ivory-line: rgba(31,61,43,0.16);
    --green:#1F3D2B;
    --green-deep:#0F1F15;
    --green-mid:#2A4D37;
    --gold:#B8964F;
    --gold-bright:#D9BC7C;
    --ink:#233420;
    --ink-soft: rgba(35,52,32,0.62);
  }

  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, var(--green-mid) 0%, var(--green) 42%, var(--green-deep) 100%);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 16px 56px;
  }

  @media (prefers-reduced-motion: no-preference){
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s ease forwards; }
    .reveal-1{animation-delay:.05s}
    .reveal-2{animation-delay:.15s}
    .reveal-3{animation-delay:.22s}
    .reveal-4{animation-delay:.29s}
    .reveal-5{animation-delay:.36s}
    .reveal-6{animation-delay:.43s}
    .reveal-7{animation-delay:.50s}
    .reveal-8{animation-delay:.57s}
    .reveal-9{animation-delay:.64s}
    @keyframes rise{to{opacity:1; transform:translateY(0);}}
  }

  .stage{
    width:100%;
    max-width:440px;
    position:relative;
  }

  .card{
    position:relative;
    background:var(--ivory);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
    overflow:hidden;
  }

  .crop{position:absolute; width:16px; height:16px; z-index:3;}
  .crop-tl{top:-8px; left:-8px; border-top:1.5px solid var(--gold-bright); border-left:1.5px solid var(--gold-bright);}
  .crop-tr{top:-8px; right:-8px; border-top:1.5px solid var(--gold-bright); border-right:1.5px solid var(--gold-bright);}
  .crop-bl{bottom:-8px; left:-8px; border-bottom:1.5px solid var(--gold-bright); border-left:1.5px solid var(--gold-bright);}
  .crop-br{bottom:-8px; right:-8px; border-bottom:1.5px solid var(--gold-bright); border-right:1.5px solid var(--gold-bright);}

  .hero{
    padding:38px 32px 26px;
    text-align:center;
    background:
      repeating-linear-gradient(135deg, rgba(184,150,79,0.05) 0 2px, transparent 2px 26px),
      var(--ivory);
  }

  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:11px;
    letter-spacing:3px;
    color:var(--gold);
    font-weight:600;
    margin-bottom:26px;
  }
  .eyebrow::before, .eyebrow::after{
    content:"";
    width:22px;
    height:1px;
    background:var(--gold);
    opacity:.55;
  }

  .logo{
    width:min(78%, 260px);
    height:auto;
    display:block;
    margin:0 auto;
  }

  .category{
    margin-top:22px;
    background:var(--green);
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .category span{
    font-size:11.5px;
    letter-spacing:2.2px;
    font-weight:600;
    color:var(--gold-bright);
    text-transform:uppercase;
  }
  .leaf{width:12px; height:12px; flex:none; opacity:.9;}

  .actions{
    padding:26px 22px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .action{
    --cut:16px;
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    background:#fff;
    border:1px solid var(--ivory-line);
    text-decoration:none;
    color:inherit;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }
  a.action:hover, a.action:focus-visible{
    border-color: var(--gold);
    background: var(--ivory-soft);
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -12px rgba(31,61,43,0.35);
  }
  a.action:active{ transform: translateY(0); }
  .action:focus-visible{ outline: 2px solid var(--green); outline-offset: 2px; }

  .badge{
    flex:none;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1.4px solid var(--gold);
    background:var(--ivory-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .badge svg{ width:20px; height:20px; stroke:var(--green); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  .text{ flex:1; min-width:0; }
  .title{
    font-size:15px;
    font-weight:600;
    letter-spacing:.3px;
    color:var(--ink);
  }
  .sub{
    display:block;
    margin-top:2px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .arrow{ flex:none; width:16px; height:16px; stroke:var(--gold); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  .action.disabled{
    background:var(--ivory);
    border-style:dashed;
    border-color: rgba(31,61,43,0.22);
    cursor:default;
  }
  .action.disabled .badge{ border-color: rgba(184,150,79,0.45); background:transparent; }
  .action.disabled .badge svg{ stroke: rgba(35,52,32,0.4); }
  .action.disabled .title{ color: rgba(35,52,32,0.55); }
  .action.disabled .sub{ color: var(--gold); opacity:.8; }

  .footer{
    margin-top:14px;
    background:var(--green);
    padding:26px 28px 22px;
    text-align:center;
  }
  .footer .mark{
    font-family:'Cormorant Garamond', serif;
    font-size:22px;
    letter-spacing:2px;
    color:var(--gold-bright);
    font-weight:600;
  }
  .footer .line{
    width:34px; height:1px;
    background: var(--gold);
    opacity:.5;
    margin:12px auto;
  }
  .footer p{
    margin:0;
    font-size:12px;
    letter-spacing:.5px;
    color: rgba(245,239,227,0.72);
    line-height:1.6;
  }

  .credit{
    text-align:center;
    margin-top:18px;
    font-size:11px;
    letter-spacing:1.5px;
    color: rgba(245,239,227,0.45);
    text-transform:uppercase;
  }
</style>
</head>
